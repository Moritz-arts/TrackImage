# One push to main is one version of TrackImage.
#
# This raises the number, writes the entry that says what changed, tags it, and
# publishes it as a PRE-RELEASE. Pre-release is the whole trick behind the two
# channels: GitHub's releases/latest never returns one, so every version shows
# up in the history without any of them claiming to be the stable one. Declaring
# a stable version is then a single click on its release page -- "Set as the
# latest release" -- and the stable channel moves to it. Nothing to upload:
# the source archive GitHub attaches on its own is what TrackImage installs.
#
# Put [skip version] in a commit message to push without any of this. The
# workflow's own commit is pushed with GITHUB_TOKEN, which by design starts no
# further runs, and carries [skip ci] as well, so it cannot chase its own tail.
name: Raise the version

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The changelog is built from the commits since the last tag, so the
          # history and the tags both have to be here.
          fetch-depth: 0

      - name: Raise the version by one
        id: bump
        run: python3 .github/bump_version.py

      - name: Write the changelog entry
        env:
          TI_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 .github/changelog_entry.py "${{ steps.bump.outputs.version }}"

      - name: Commit, tag and push
        id: push
        run: |
          if git diff --quiet; then
            echo "Nothing moved -- no version line, no changelog."
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "v${{ steps.bump.outputs.version }} [skip ci]"
          # The tag must sit on the commit that carries the new number, or the
          # archive would claim a version it does not contain -- which is the
          # exact trap this whole arrangement exists to close.
          git tag -a "v${{ steps.bump.outputs.version }}" \
                  -m "v${{ steps.bump.outputs.version }}"
          # Somebody may have pushed while this ran. Rebase onto whatever is
          # there now and try once more; a second failure means the branch is
          # moving faster than this job, and the next push raises it anyway.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git tag -f -a "v${{ steps.bump.outputs.version }}" \
                     -m "v${{ steps.bump.outputs.version }}"
            git push origin HEAD:main
          }
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

      - name: Publish it as a pre-release
        if: ${{ steps.push.outputs.pushed == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --prerelease \
            --verify-tag
