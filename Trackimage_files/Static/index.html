<!DOCTYPE html>
<html lang="en">
<head>

<body>
<div id="ti-splash" style="position:fixed;inset:0;background:#0d0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999"><div style="font-family:'Space Mono',monospace;font-weight:700;font-size:22px;color:#e8b23e">◈ TrackImage</div><div style="width:26px;height:26px;border:3px solid #333;border-top-color:#e8b23e;border-radius:50%;animation:tispin .9s linear infinite"></div><div style="color:#888;font-size:13px">Loading collection…</div></div>
<style>@keyframes tispin{to{transform:rotate(360deg)}}</style>
<script>setTimeout(function(){var s=document.getElementById('ti-splash');if(s)s.remove();},25000);</script>
<div class="content" id="content"></div>
<div class="toast" id="toast"></div>
<div id="import-veil"><div class="iv-card" id="iv-card"></div></div>
  <script>
  /* Rendered by Flask, so it can hold Jinja. Everything the
     server decides at start-up is set here, before the files below
     that read it. */
  var TI_VERSION = '{{ version }}';
  var WINDOW_MODE = {{ 'true' if window_mode else 'false' }};
  var NATIVE_DRAG = {{ 'true' if native_drag else 'false' }};
  var SERVER_WINDOW = {{ 'true' if server_window else 'false' }};
  var IS_WINDOWS = {{ 'true' if is_windows else 'false' }};
  var NATIVE_DROP = {{ 'true' if native_drop else 'false' }};
  </script>
  <script src="/static/js/01-state.js"></script>
  <script src="/static/js/02-util.js"></script>
  <script src="/static/js/03-api.js"></script>
  <script src="/static/js/04-render.js"></script>
  <script src="/static/js/05-gallery.js"></script>
  <script src="/static/js/06-detail.js"></script>
  <script src="/static/js/07-folders.js"></script>
  <script src="/static/js/08-tags.js"></script>
  <script src="/static/js/09-duplicates.js"></script>
  <script src="/static/js/10-import.js"></script>
  <script src="/static/js/11-settings.js"></script>
  <script src="/static/js/12-modals.js"></script>
  <script src="/static/js/13-startup.js"></script>

</body>
